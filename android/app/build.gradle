apply plugin: 'com.android.application'

def calculateVersionCode = { String version ->
    try {
        def clean = version.replaceAll("[^0-9.]", "")
        def parts = clean.split("\\.")
        int major = parts.length > 0 ? parts[0].toInteger() : 1
        int minor = parts.length > 1 ? parts[1].toInteger() : 0
        int patch = parts.length > 2 ? parts[2].toInteger() : 0
        return (major * 1000000) + (minor * 10000) + (patch * 100)
    } catch (Exception e) {
        return 1
    }
}

// Release versions must be explicit and monotonically increasing so Android can
// install a new APK as an update instead of treating it as a separate build.
def appVersionName = System.getenv("VERSION_NAME") ?: (project.hasProperty('versionName') ? project.property('versionName') : "1.0.214")
def appVersionCode = System.getenv("VERSION_CODE") ? System.getenv("VERSION_CODE").toInteger() : (project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : calculateVersionCode(appVersionName))
if (appVersionCode < 1021400) {
    throw new GradleException("VERSION_CODE must be >= 1021400 for update-compatible releases.")
}

android {
    namespace = "com.universal.smarttv.remote"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.universal.smarttv.remote"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        debug {
            def debugKeystore = file(System.getProperty("user.home") + "/.android/debug.keystore")
            if (debugKeystore.exists()) {
                storeFile debugKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_FILE") ?: (project.hasProperty('RELEASE_STORE_FILE') ? project.property('RELEASE_STORE_FILE') : null)
            if (keystorePath && file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: (project.hasProperty('RELEASE_STORE_PASSWORD') ? project.property('RELEASE_STORE_PASSWORD') : "")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: (project.hasProperty('RELEASE_KEY_ALIAS') ? project.property('RELEASE_KEY_ALIAS') : "")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: (project.hasProperty('RELEASE_KEY_PASSWORD') ? project.property('RELEASE_KEY_PASSWORD') : "")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            // Never silently produce an unsigned release APK. A release APK must
            // use the same permanent signing key for future in-place updates.
            def keystorePath = System.getenv("ANDROID_KEYSTORE_FILE") ?: (project.hasProperty('RELEASE_STORE_FILE') ? project.property('RELEASE_STORE_FILE') : null)
            if (!keystorePath || !file(keystorePath).exists()) {
                throw new GradleException("Release signing keystore is missing. Configure ANDROID_KEYSTORE_FILE/RELEASE_STORE_FILE and the matching credentials.")
            }

            def storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: (project.hasProperty('RELEASE_STORE_PASSWORD') ? project.property('RELEASE_STORE_PASSWORD') : "")
            def keyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: (project.hasProperty('RELEASE_KEY_ALIAS') ? project.property('RELEASE_KEY_ALIAS') : "")
            def keyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: (project.hasProperty('RELEASE_KEY_PASSWORD') ? project.property('RELEASE_KEY_PASSWORD') : "")

            if (!storePassword || !keyAlias || !keyPassword) {
                throw new GradleException("Release signing credentials are missing.")
            }

            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "org.bouncycastle:bcprov-jdk18on:1.78.1"
    implementation "org.bouncycastle:bcpkix-jdk18on:1.78.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
