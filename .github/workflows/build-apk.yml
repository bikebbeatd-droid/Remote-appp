name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Configure stable release signing when secrets are available
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            mkdir -p android/app/keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore/release.keystore
            echo "ANDROID_KEYSTORE_FILE=keystore/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable APK
        working-directory: android
        env:
          VERSION_NAME: 1.0.${{ github.run_number }}
          VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew :app:assembleRelease --stacktrace --no-daemon
          else
            mkdir -p "$HOME/.android"
            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1); else APK="android/app/build/outputs/apk/debug/app-debug.apk"; fi
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remote-appp-installable-apk
          path: |
            ${{ env.APK }}
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish one rolling GitHub Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="latest"
          ASSET="Universal-Smart-TV-Remote.apk"
          SIGNING_MODE="${{ steps.signing.outputs.signed }}"
          if [ "$SIGNING_MODE" = "true" ]; then SIGNING_NOTE="Stable release signing"; else SIGNING_NOTE="Debug signing; uninstall older builds signed with a different key before installing"; fi
          cp "$APK" "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" apk-sha256.txt --clobber
            gh release edit "$TAG" --target "${{ github.sha }}" --title "Remote-appp Latest APK" --notes "Latest build-verified installable APK. One rolling release is maintained. $SIGNING_NOTE."
          else
            gh release create "$TAG" "$ASSET" apk-sha256.txt --target "${{ github.sha }}" --title "Remote-appp Latest APK" --notes "Latest build-verified installable APK. One rolling release is maintained. $SIGNING_NOTE."
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            if [ "$name" != "$ASSET" ] && [[ "$name" == *.apk ]]; then gh release delete-asset "$TAG" "$name" --yes || true; fi
          done

      - name: Report build result
        if: always()
        run: |
          echo "## Android APK Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- One rolling GitHub Release: latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signing: ${{ steps.signing.outputs.signed == 'true' && 'stable release keystore' || 'runner debug keystore' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- If stable signing secrets are absent, this is a debug-signed test APK and cannot update an APK signed with a different certificate." >> "$GITHUB_STEP_SUMMARY"
          echo "- APK distribution: GitHub Release + Actions artifact" >> "$GITHUB_STEP_SUMMARY"
