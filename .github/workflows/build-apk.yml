name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-build-${{ github.ref }}
  cancel-in-progress: true


env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Android project toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          node --version
          npm --version
          test -f android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'gradle-8.14.3-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'com.android.tools.build:gradle:8.13.0' android/build.gradle

      - name: Setup Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee apk-sha256.txt
          echo "APK size: $(du -h "$APK" | cut -f1)"

      # APK distribution stays outside the app. GitHub Actions artifacts/releases
      # are the only distribution outputs produced by CI.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remote-appp-debug-apk-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ASSET="Remote-appp-debug-${{ github.run_number }}.apk"
          cp "$APK" "$ASSET"
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" "$ASSET" \
            --target "${{ github.sha }}" \
            --title "Remote-appp Debug APK Build #${{ github.run_number }}" \
            --latest \
            --notes "Debug APK for testing. APK is distributed only through GitHub Actions/Release; it is not embedded in the app.\n\nCommit: ${{ github.sha }}\nNode.js 22 / Java 21 / AGP 8.13.0 / Gradle 8.14.3 / compileSdk 36 / targetSdk 36 / minSdk 24."

      - name: Report build result
        if: always()
        run: |
          echo "## Android APK Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK distribution: GitHub Actions artifact + GitHub Release only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node.js: 22 LTS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Java: 21" >> "$GITHUB_STEP_SUMMARY"
          echo "- AGP: 8.13.0" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gradle: 8.14.3" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android SDK: compile/target 36, min 24" >> "$GITHUB_STEP_SUMMARY"
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then echo "- APK generated: yes" >> "$GITHUB_STEP_SUMMARY"; else echo "- APK generated: no" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f apk-sha256.txt ]; then echo "- SHA-256: $(cat apk-sha256.txt)" >> "$GITHUB_STEP_SUMMARY"; fi
