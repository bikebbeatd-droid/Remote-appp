name: Build & Publish Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          node --version
          npm --version
          test -f android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'gradle-8.14.3-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q "com.android.tools.build:gradle:8.13.0" android/build.gradle
          echo "Verified Android project toolchain: Java 17, AGP 8.13.0, Gradle 8.14.3"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK with project Gradle wrapper
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee apk-sha256.txt
          echo "APK size: $(du -h "$APK" | cut -f1)"
          echo "APK path: $APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ASSET="Remote-appp-debug-${{ github.run_number }}.apk"
          cp "$APK" "$ASSET"

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Remote-appp Debug APK Build #${{ github.run_number }}"

          gh release create "$TAG" "$ASSET" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --latest \
            --notes "Debug APK for testing the current main branch.\n\nRun: #${{ github.run_number }}\nAttempt: ${{ github.run_attempt }}\nCommit: ${{ github.sha }}\n\nThis APK is debug-signed and is not a Play Store production build.\nThe project toolchain is kept aligned with the repository: AGP 8.13.0, Gradle 8.14.3, Java 17, compileSdk 36, targetSdk 36, minSdk 24."

      - name: Report build result
        if: always()
        shell: bash
        run: |
          echo "## Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project toolchain: AGP 8.13.0 / Gradle 8.14.3 / Java 17" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_STEP_SUMMARY"
          if [ -f apk-sha256.txt ]; then
            echo "- SHA-256: $(cat apk-sha256.txt)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.release.outcome }}" = "success" ]; then
            echo "- GitHub Release: created successfully" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- GitHub Release: not created; the Actions artifact remains available" >> "$GITHUB_STEP_SUMMARY"
          fi
