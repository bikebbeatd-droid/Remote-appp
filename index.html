<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Universal Smart TV Remote</title>
    <meta name="description" content="Global Universal Remote Platform with audited multi-protocol hardware adapters (Android TV, Tizen, webOS, Roku, Bravia, Viera, JointSpace, SmartCast, Apple TV, Vidaa, Consumer IR), device library, compatibility center, and customizable button decks." />
    <meta property="og:title" content="Universal Smart TV Remote" />
    <meta property="og:description" content="Global Universal Remote Platform with audited multi-protocol hardware adapters (Android TV, Tizen, webOS, Roku, Bravia, Viera, JointSpace, SmartCast, Apple TV, Vidaa, Consumer IR), device library, compatibility center, and customizable button decks." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body style="margin:0;background:#09090b;color:#fff;">
    <div id="root">
      <div id="native-boot-screen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#09090b;font-family:system-ui,-apple-system,sans-serif;">
        <div style="width:min(92vw,420px);text-align:center;padding:28px;">
          <div style="width:64px;height:64px;margin:0 auto 18px;border-radius:18px;background:#18181b;border:1px solid #27272a;display:flex;align-items:center;justify-content:center;font-size:30px;">📺</div>
          <h1 style="margin:0 0 8px;font-size:22px;">Universal Smart TV Remote</h1>
          <p id="boot-status" style="margin:0;color:#a1a1aa;font-size:13px;">Starting app…</p>
          <div style="height:4px;background:#27272a;border-radius:99px;margin:20px auto 0;overflow:hidden;max-width:260px;">
            <div id="boot-progress" style="height:100%;width:15%;background:#6366f1;border-radius:99px;transition:width .3s;"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var status = document.getElementById('boot-status');
        var progress = document.getElementById('boot-progress');
        var timer = setTimeout(function () {
          if (status && document.getElementById('root') && document.getElementById('root').children.length === 1) {
            status.textContent = 'The app is taking longer than expected. Tap Reload if it stays here.';
            progress.style.width = '100%';
            var b = document.createElement('button');
            b.textContent = 'Reload app';
            b.style.cssText = 'margin-top:18px;padding:11px 18px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font-weight:700;';
            b.onclick = function () { location.reload(); };
            status.parentNode.appendChild(b);
          }
        }, 9000);
        window.addEventListener('error', function (e) {
          if (status) status.textContent = 'Startup error: ' + (e.message || 'JavaScript failed to load');
          if (progress) progress.style.width = '100%';
        });
        window.addEventListener('unhandledrejection', function (e) {
          if (status) status.textContent = 'Startup error: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason || 'Unknown error'));
          if (progress) progress.style.width = '100%';
        });
        window.addEventListener('load', function () {
          if (progress) progress.style.width = '55%';
          if (status) status.textContent = 'Loading remote interface…';
          setTimeout(function () { clearTimeout(timer); }, 1000);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
